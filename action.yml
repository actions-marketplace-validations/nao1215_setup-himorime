name: "Setup himorime"
description: "Install the himorime CLI by downloading a prebuilt release binary (Linux, macOS, Windows / amd64, arm64)."
author: "CHIKAMATSU Naohiro"

branding:
  icon: "download"
  color: "blue"

inputs:
  version:
    description: 'Version of himorime to install (e.g. "v0.1.0" or "0.1.0"). Use "latest" to install the most recent release.'
    required: false
    default: "latest"
  github-token:
    description: "GitHub token for downloads and automatic same-repository PR comments; commenting needs pull-requests: write."
    required: false
    default: ${{ github.token }}
  install-dir:
    description: "Directory to install the himorime binary into. Defaults to $HOME/.himorime/bin."
    required: false
    default: ""
  verify-checksum:
    description: 'Verify the downloaded archive against checksums.txt (SHA-256). Set to "false" to skip.'
    required: false
    default: "true"
  verify-attestation:
    description: 'Verify the archive build provenance with "gh attestation verify". Requires the gh CLI. Opt-in.'
    required: false
    default: "false"
  add-to-path:
    description: 'Add the install directory to PATH for subsequent steps. Set to "false" to only expose the outputs.'
    required: false
    default: "true"

outputs:
  version:
    description: "The resolved version of himorime that was installed (e.g. v0.1.0)."
  bin-path:
    description: "Absolute path to the installed himorime binary."
  install-dir:
    description: "Directory the himorime binary was installed into (added to PATH)."

runs:
  using: "node24"
  main: "scripts/action.mjs"
  post: "scripts/post.mjs"
